name: ATLAS SOLARIS — publikacja GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'portal/**'
      - 'etapy/**'
      - 'dzialy/**'
      - 'laboratoria/**'
      - 'o-projekcie/**'
      - 'opowiesc/**'
      - 'legal/**'
      - 'atlas.html'
      - '404.html'
      - 'tests/method07-story.test.cjs'
      - 'tests/sky06-story.test.cjs'
      - 'tests/moon05-story.test.cjs'
      - 'tests/earth04-story.test.cjs'
      - 'tests/solar03-story.test.cjs'
      - 'tests/solar02-story.test.cjs'
      - 'tests/solar01-story.test.cjs'
      - 'tests/universe28-story.test.cjs'
      - 'tests/star29-story.test.cjs'
      - 'tests/binary30-story.test.cjs'
      - 'tests/lens31-story.test.cjs'
      - 'tests/pulsar32-story.test.cjs'
      - 'tests/pulsar32.test.cjs'
      - 'tests/pulsar32-browser.test.cjs'
      - 'tests/portal-navigation.test.cjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-solaris-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Zbuduj i opublikuj stronę
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz najnowszy kod main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sprawdź pliki strony
        shell: bash
        run: |
          test -s index.html
          test -d css
          test -d js
          test -d data
          test -f .nojekyll
          test -s portal/data.js
          test -s portal/stage.js
          test -s portal/reader-ui.js
          test -s portal/method07-story.css
          test -s portal/method07-story.js
          test -s portal/media/method07-cover.svg
          test -s etapy/07/index.html
          test -s portal/sky06-story.css
          test -s portal/sky06-story.js
          test -s portal/media/sky06-cover.svg
          test -s etapy/06/index.html
          test -s portal/moon05-story.css
          test -s portal/moon05-story.js
          test -s portal/media/moon05-cover.svg
          test -s etapy/05/index.html
          test -s portal/earth04-story.css
          test -s portal/earth04-story.js
          test -s portal/media/earth04-cover.svg
          test -s etapy/04/index.html
          test -s portal/solar03-story.css
          test -s portal/solar03-story.js
          test -s portal/media/solar03-cover.svg
          test -s etapy/03/index.html
          test -s etapy/11/index.html
          test -s etapy/12/index.html
          test -s portal/gravity12-story.css
          test -s portal/gravity12-story.js
          test -s portal/media/gravity12-cover.jpg
          test -s portal/mission11-story.css
          test -s portal/mission11-story.js
          test -s portal/media/mission11-cover.svg
          test -s portal/solar02-story.css
          test -s portal/solar02-story.js
          test -s portal/media/solar02-cover.svg
          test -s etapy/02/index.html
          test -s portal/solar01-story.css
          test -s portal/media/solar01-cover.svg
          test -s etapy/01/index.html
          test -s portal/universe28-story.css
          test -s portal/media/universe28-cover.svg
          test -s etapy/28/index.html
          test -s portal/star29-story.css
          test -s portal/media/star29-cover.svg
          test -s etapy/29/index.html
          test -s portal/binary30-story.css
          test -s portal/media/binary30-cover.svg
          test -s etapy/30/index.html
          test -s portal/lens31-story.css
          test -s portal/media/lens31-cover.svg
          test -s portal/pulsar32-story.css
          test -s portal/media/pulsar32-cover.svg
          test -s portal/pulsar32-ui.js
          test -s laboratoria/pulsar/index.html
          test -s etapy/32/index.html
          node --check portal/data.js
          node --check portal/site.js
          node --test tests/portal-navigation.test.cjs
          node --check portal/reader-ui.js
          node --check portal/stage.js
          node --check portal/mission11-story.js
          node --check portal/gravity12-story.js
          node --test tests/gravity12-story.test.cjs
          node --test tests/mission11-story.test.cjs
          node --check portal/method07-story.js
          node --check portal/sky06-story.js
          node --check portal/moon05-story.js
          node --check portal/earth04-story.js
          node --check portal/solar03-story.js
          node --check portal/solar02-story.js
          node --check portal/universe28.js
          node --check portal/star29.js
          node --check portal/pulsar32-core.js
          node --check portal/pulsar32-ui.js
          node --test tests/method07-story.test.cjs tests/sky06-story.test.cjs tests/moon05-story.test.cjs tests/earth04-story.test.cjs tests/solar03-story.test.cjs tests/solar02-story.test.cjs tests/solar01-story.test.cjs tests/universe28-story.test.cjs tests/star29-story.test.cjs tests/binary30.test.cjs tests/binary30-story.test.cjs tests/lens31.test.cjs tests/lens31-story.test.cjs tests/pulsar32.test.cjs tests/pulsar32-story.test.cjs
          node tests/pulsar32-browser.test.cjs
          node --check js/app.js
          node --check js/blackhole201-core.js
          node --check js/blackhole201-renderer.js
          node --check js/blackhole201-ui.js
      - name: Przygotuj wyłącznie pliki publicznej strony
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='tests/' --exclude='scripts/' --exclude='*.md' --exclude='*.py' ./ _site/
          test -s _site/etapy/07/index.html
          test -s _site/portal/method07-story.css
          test -s _site/portal/method07-story.js
          test -s _site/portal/media/method07-cover.svg
          test -s _site/etapy/06/index.html
          test -s _site/portal/sky06-story.css
          test -s _site/portal/sky06-story.js
          test -s _site/portal/media/sky06-cover.svg
          test -s _site/etapy/05/index.html
          test -s _site/portal/moon05-story.css
          test -s _site/portal/moon05-story.js
          test -s _site/portal/media/moon05-cover.svg
          test -s _site/etapy/04/index.html
          test -s _site/portal/earth04-story.css
          test -s _site/portal/earth04-story.js
          test -s _site/portal/media/earth04-cover.svg
          test -s _site/etapy/03/index.html
          test -s _site/etapy/11/index.html
          test -s _site/etapy/12/index.html
          test -s _site/portal/gravity12-story.css
          test -s _site/portal/gravity12-story.js
          test -s _site/portal/media/gravity12-cover.jpg
          test -s _site/portal/mission11-story.css
          test -s _site/portal/mission11-story.js
          test -s _site/portal/media/mission11-cover.svg
          test -s _site/portal/solar03-story.css
          test -s _site/portal/solar03-story.js
          test -s _site/portal/media/solar03-cover.svg
          test -s _site/etapy/02/index.html
          test -s _site/portal/solar02-story.css
          test -s _site/portal/solar02-story.js
          test -s _site/portal/media/solar02-cover.svg
          test -s _site/etapy/01/index.html
          test -s _site/portal/solar01-story.css
          test -s _site/portal/media/solar01-cover.svg
          test -s _site/etapy/28/index.html
          test -s _site/portal/universe28-story.css
          test -s _site/portal/media/universe28-cover.svg
          test -s _site/etapy/29/index.html
          test -s _site/portal/star29-story.css
          test -s _site/portal/media/star29-cover.svg
          test -s _site/etapy/30/index.html
          test -s _site/portal/binary30-story.css
          test -s _site/portal/media/binary30-cover.svg
          test -s _site/etapy/31/index.html
          test -s _site/portal/lens31-story.css
          test -s _site/portal/media/lens31-cover.svg
          test -s _site/etapy/32/index.html
          test -s _site/portal/media/pulsar32-cover.svg
          test -s _site/portal/pulsar32-story.css
          test -s _site/laboratoria/pulsar/index.html
          echo "Publishing commit: ${GITHUB_SHA}"
          echo "Published title:"
          grep -m 1 -o '<title>[^<]*</title>' _site/index.html
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Zapakuj stronę
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Opublikuj GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
