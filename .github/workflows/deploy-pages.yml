name: ATLAS SOLARIS — publikacja GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'portal/**'
      - 'etapy/**'
      - 'dzialy/**'
      - 'laboratoria/**'
      - 'o-projekcie/**'
      - 'opowiesc/**'
      - 'legal/**'
      - 'atlas.html'
      - '404.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-solaris-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Zbuduj i opublikuj stronę
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz najnowszy kod main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sprawdź pliki strony
        shell: bash
        run: |
          test -s index.html
          test -d css
          test -d js
          test -d data
          test -f .nojekyll
          test -s portal/data.js
          test -s portal/pulsar32-ui.js
          test -s laboratoria/pulsar/index.html
          test -s etapy/32/index.html
          node --check portal/data.js
          node --check portal/site.js
          node --check portal/pulsar32-core.js
          node --check portal/pulsar32-ui.js
          node --test tests/pulsar32.test.cjs
          node tests/pulsar32-browser.test.cjs
          node --check js/app.js
          node --check js/blackhole201-core.js
          node --check js/blackhole201-renderer.js
          node --check js/blackhole201-ui.js
      - name: Przygotuj wyłącznie pliki publicznej strony
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='tests/' --exclude='scripts/' --exclude='*.md' --exclude='*.py' ./ _site/
          test -s _site/etapy/32/index.html
          test -s _site/laboratoria/pulsar/index.html
          echo "Publishing commit: ${GITHUB_SHA}"
          echo "Published title:"
          grep -m 1 -o '<title>[^<]*</title>' _site/index.html
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Zapakuj stronę
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Opublikuj GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
