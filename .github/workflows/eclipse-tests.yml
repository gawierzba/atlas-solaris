name: ATLAS SOLARIS — testy laboratoriów astronomicznych 17–19
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/eclipse*.js'
      - 'js/observatory18*.js'
      - 'js/interstellar19*.js'
      - 'js/app.js'
      - 'tests/eclipse*.cjs'
      - 'tests/observatory18*.cjs'
      - 'tests/interstellar19*.cjs'
      - 'css/eclipse*.css'
      - 'css/observatory18*.css'
      - 'css/interstellar19.css'
      - 'index.html'
      - '.github/workflows/eclipse-tests.yml'
  push:
    branches: [main]
    paths:
      - 'js/eclipse*.js'
      - 'js/observatory18*.js'
      - 'js/interstellar19*.js'
      - 'js/app.js'
      - 'tests/eclipse*.cjs'
      - 'tests/observatory18*.cjs'
      - 'tests/interstellar19*.cjs'
      - '.github/workflows/eclipse-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eclipses:
    name: Testy geometrii i obserwatorium
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź składnię modułów
        run: |
          node --check js/app.js
          node --check js/eclipse-engine.js
          node --check js/eclipse17-calendar-search.js
          node --check js/eclipse17-map-engine.js
          node --check js/eclipse17-map-ui.js
          node --check js/eclipse17-motion.js
          node --check js/eclipse17-motion-ui.js
          node --check js/observatory18-core.js
          node --check js/observatory18-ui.js
          node --check js/observatory181-catalog.js
          node --check js/observatory181-core.js
          node --check js/observatory181-ui.js
          node --check js/interstellar19-data.js
          node --check js/interstellar19-core.js
          node --check js/interstellar19-ui.js
      - name: Test klasyfikacji zaćmień 17.0
        run: node tests/eclipse17.test.cjs
      - name: Test kalendarza zaćmień 17.1
        run: node tests/eclipse17-calendar.test.cjs
      - name: Test mapy zaćmień 17.2
        run: node tests/eclipse17-map.test.cjs
      - name: Test animacji wędrówki cienia 17.3
        run: node tests/eclipse17-motion.test.cjs
      - name: Test żywego obserwatorium 18.0
        run: node tests/observatory18.test.cjs
      - name: Test atlasu Messiera i gwiazdozbiorów 18.1
        run: node tests/observatory181.test.cjs
      - name: Test podróży między gwiazdami 19.0
        run: node tests/interstellar19.test.cjs
