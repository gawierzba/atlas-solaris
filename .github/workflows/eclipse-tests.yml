name: ATLAS SOLARIS — testy astronomii 17–27.0
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/eclipse*.js'
      - 'js/observatory18*.js'
      - 'js/interstellar19*.js'
      - 'js/blackhole20*.js'
      - 'js/probe21*.js'
      - 'js/cockpit22*.js'
      - 'js/merger23*.js'
      - 'js/ligo24*.js'
      - 'js/zodiac25*.js'
      - 'js/time26*.js'
      - 'portal/**'
      - 'etapy/**'
      - 'dzialy/**'
      - 'laboratoria/**'
      - 'o-projekcie/**'
      - 'atlas.html'
      - 'js/app.js'
      - 'tests/eclipse*.cjs'
      - 'tests/observatory18*.cjs'
      - 'tests/interstellar19*.cjs'
      - 'tests/blackhole20*.cjs'
      - 'tests/probe21*.cjs'
      - 'tests/cockpit22*.cjs'
      - 'tests/merger23*.cjs'
      - 'tests/ligo24*.cjs'
      - 'tests/zodiac25*.cjs'
      - 'tests/time26*.cjs'
      - 'tests/portal27.test.cjs'
      - 'css/eclipse*.css'
      - 'css/observatory18*.css'
      - 'css/interstellar19.css'
      - 'css/blackhole20*.css'
      - 'css/probe21.css'
      - 'css/cockpit22.css'
      - 'css/merger23.css'
      - 'css/ligo24.css'
      - 'css/zodiac25*.css'
      - 'css/time26*.css'
      - 'index.html'
      - '.github/workflows/eclipse-tests.yml'
  push:
    branches: [main]
    paths:
      - 'js/eclipse*.js'
      - 'js/observatory18*.js'
      - 'js/interstellar19*.js'
      - 'js/blackhole20*.js'
      - 'js/probe21*.js'
      - 'js/cockpit22*.js'
      - 'js/merger23*.js'
      - 'js/ligo24*.js'
      - 'js/zodiac25*.js'
      - 'js/time26*.js'
      - 'portal/**'
      - 'etapy/**'
      - 'dzialy/**'
      - 'laboratoria/**'
      - 'o-projekcie/**'
      - 'atlas.html'
      - 'js/app.js'
      - 'tests/eclipse*.cjs'
      - 'tests/observatory18*.cjs'
      - 'tests/interstellar19*.cjs'
      - 'tests/blackhole20*.cjs'
      - 'tests/probe21*.cjs'
      - 'tests/cockpit22*.cjs'
      - 'tests/merger23*.cjs'
      - 'tests/ligo24*.cjs'
      - 'tests/zodiac25*.cjs'
      - 'tests/time26*.cjs'
      - 'tests/portal27.test.cjs'
      - '.github/workflows/eclipse-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eclipses:
    name: Testy geometrii i obserwatorium
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź składnię modułów
        run: |
          node --check js/app.js
          node --check js/eclipse-engine.js
          node --check js/eclipse17-calendar-search.js
          node --check js/eclipse17-map-engine.js
          node --check js/eclipse17-map-ui.js
          node --check js/eclipse17-motion.js
          node --check js/eclipse17-motion-ui.js
          node --check js/observatory18-core.js
          node --check js/observatory18-ui.js
          node --check js/observatory181-catalog.js
          node --check js/observatory181-core.js
          node --check js/observatory181-ui.js
          node --check js/interstellar19-data.js
          node --check js/interstellar19-core.js
          node --check js/interstellar19-ui.js
          node --check js/blackhole20-core.js
          node --check js/blackhole20-renderer.js
          node --check js/blackhole20-ui.js
          node --check js/blackhole201-core.js
          node --check js/blackhole201-renderer.js
          node --check js/blackhole201-ui.js
          node --check js/probe21-core.js
          node --check js/probe21-ui.js
          node --check js/cockpit22-core.js
          node --check js/cockpit22-renderer.js
          node --check js/cockpit22-ui.js
          node --check js/merger23-core.js
          node --check js/merger23-ui.js
          node --check js/ligo24-core.js
          node --check js/ligo24-ui.js
          node --check js/zodiac25-core.js
          node --check js/zodiac25-ui.js
          node --check js/zodiac251-bounds.js
          node --check js/zodiac251-core.js
          node --check js/zodiac251-ui.js
          node --check js/time26-core.js
          node --check js/time26-ui.js
          node --check portal/site.js
          node --check portal/stage.js
          node --check portal/embed.js
      - name: Test klasyfikacji zaćmień 17.0
        run: node tests/eclipse17.test.cjs
      - name: Test kalendarza zaćmień 17.1
        run: node tests/eclipse17-calendar.test.cjs
      - name: Test mapy zaćmień 17.2
        run: node tests/eclipse17-map.test.cjs
      - name: Test animacji wędrówki cienia 17.3
        run: node tests/eclipse17-motion.test.cjs
      - name: Test żywego obserwatorium 18.0
        run: node tests/observatory18.test.cjs
      - name: Test atlasu Messiera i gwiazdozbiorów 18.1
        run: node tests/observatory181.test.cjs
      - name: Test podróży między gwiazdami 19.0
        run: node tests/interstellar19.test.cjs
      - name: Test czarnej dziury i geodezyjnych 20.0
        run: node tests/blackhole20.test.cjs
      - name: Test shaderów WebGL2 w przeglądarce (jeżeli dostępna)
        run: node tests/blackhole20-browser.test.cjs
      - name: Test metryki Kerra i wleczenia czasoprzestrzeni 20.1
        run: node tests/blackhole201.test.cjs
      - name: Test GPU obrazów obracającej się czarnej dziury Kerra
        run: node tests/blackhole201-browser.test.cjs
      - name: Test lotu sondy przez ergosferę 21.0
        run: node tests/probe21.test.cjs
      - name: Test przeglądarkowy misji przez ergosferę 21.0
        run: node tests/probe21-browser.test.cjs
      - name: Test kamerowej fizyki Kerr i mostka 21–22
        run: node tests/cockpit22.test.cjs
      - name: Test przeglądarkowy kamery sondy 22.0
        run: node tests/cockpit22-browser.test.cjs
      - name: Test fizyki fal grawitacyjnych i zderzenia 23.0
        run: node tests/merger23.test.cjs
      - name: Test przeglądarkowy symulacji GW150914 23.0
        run: node tests/merger23-browser.test.cjs
      - name: Test fizyki interferometru i filtru dopasowanego LIGO 24.0
        run: node tests/ligo24.test.cjs
      - name: Test Chromium widoku LIGO i dwudetektorowej detekcji 24.0
        run: node tests/ligo24-browser.test.cjs
      - name: Test dwóch zodiaków 25.0
        run: node tests/zodiac25.test.cjs
      - name: Test prawdziwych granic IAU i paralaksy 25.1
        run: node tests/zodiac251.test.cjs
      - name: Test precesji ziemskiej Vondrak/ERFA 26.0
        run: node tests/time26.test.cjs
      - name: Test katalogu 26 osobnych podstron portalu 27.0
        run: node tests/portal27.test.cjs
