name: Pulsar 32 — wizualny test przeglądarki
on:
  push:
    paths:
      - 'portal/pulsar32-*'
      - 'laboratoria/pulsar/**'
      - 'etapy/32/**'
      - 'tests/pulsar32-e2e.test.cjs'
      - '.github/workflows/pulsar32-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Exercise actual stage iframe
        run: node tests/pulsar32-e2e.test.cjs
      - name: Preserve comparative scene screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar32-visual-compare
          path: _pulsar_e2e/*.png
          if-no-files-found: ignore
          retention-days: 7
