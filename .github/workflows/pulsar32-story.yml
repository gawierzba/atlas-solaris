name: ATLAS SOLARIS — artykul i laboratorium pulsara
on:
  push:
    branches: [main]
    paths:
      - 'etapy/32/**'
      - 'portal/pulsar32-story.css'
      - 'portal/media/pulsar32-cover.svg'
      - 'portal/stage.js'
      - 'tests/pulsar32-story.test.cjs'
      - 'tests/pulsar32-story-browser.test.cjs'
      - '.github/workflows/pulsar32-story.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  article:
    name: Czytanie, wydajnosc i responsywnosc
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testy struktury i nauki
        run: |
          node --check portal/stage.js
          node --test tests/pulsar32-story.test.cjs tests/pulsar32.test.cjs
      - name: Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Chromium
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Test przegladarkowy artykulu, telefonu i lazy loading
        run: node tests/pulsar32-story-browser.test.cjs
      - name: Zapis miniaturek do oceny
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-solaris-pulsar32-article-preview
          path: _pulsar_story/*.png
          if-no-files-found: ignore
          retention-days: 7
