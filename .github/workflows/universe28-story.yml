name: ATLAS SOLARIS — wyprawa po skali Wszechswiata 28
on:
  push:
    branches: [main]
    paths:
      - 'etapy/28/**'
      - 'portal/universe28-story.css'
      - 'portal/media/universe28-cover.svg'
      - 'portal/universe28.js'
      - 'portal/stage.js'
      - 'tests/universe28-story.test.cjs'
      - 'tests/universe28-story-browser.test.cjs'
      - '.github/workflows/universe28-story.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expedition:
    name: Audyt naukowy, render mobilny i wydajnosc
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zgodnosc i model naukowy
        run: |
          node --check portal/stage.js
          node --check portal/universe28.js
          node --test tests/universe28-story.test.cjs
      - name: Przygotuj Chrome
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium-headless-shell
      - name: Test artykulu na desktop i telefonach
        run: node tests/universe28-story-browser.test.cjs
      - name: Zachowaj miniatury
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-solaris-universe28-article-previews
          path: _universe28_story/*.png
          if-no-files-found: ignore
          retention-days: 7
