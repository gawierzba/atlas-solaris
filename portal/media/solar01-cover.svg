<title id="title">Atlas Słońca — osiem orbit na astronomicznej mapie</title>
<desc id="desc">Autorska, nieruchoma ilustracja w stylu dawnego atlasu astronomicznego: Słońce po prawej, a wokół niego osiem orbit z planetami, gwiazdami i delikatnymi liniami pomiarowymi. Wielkości planet, odległości i położenia są artystyczne, a nie w skali ani dla konkretnej daty.</desc>
